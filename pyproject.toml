[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ulpf"
version = "0.1.0"
description = "Universal Log Pre-processing Framework"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pydantic",
    "pyyaml"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]